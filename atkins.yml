name: Vuego CLI automation

vars:
  name: vuego-cli
  build:
    path: .
    goarch: [arm64, amd64]

jobs:
  default:
    desc: "Format, lint, test and update the compose setup"
    steps:
      - task: generate
      - task: fmt
      - task: lint
      - task: test
      - task: install
      - task: up

  fmt:
    desc: "Run formatters"
    steps:
      - goimports -w -local $(go list .) .
      - goimports-reviser -set-alias -format -imports-order "std,blanked,general,company,project" ./...
      - go fmt ./...
      - go mod tidy

  generate:
    desc: "Generate Tailwind CSS"
    passthru: true
    steps:
      - run: tailwindcss
             -i basecoat/assets/css/basecoat.input.css
             -o basecoat/assets/css/basecoat.css

  tailwind:setup:
    steps:
      - npm install -D tailwindcss@3 postcss autoprefixer

  test:
    desc: "Run tests"
    passthru: true
    tty: true
    steps:
      - gotestsum ./... -- -count 1

  lint:
    desc: "Run linters"
    passthru: true
    steps:
      - go-fsck lint ./... || true
      - go vet ./...

  build:
    desc: "Build"
    depends_on: fmt
    vars:
      goos: linux
    steps:
      - for: goarch in ${{build.goarch}}
        env:
          vars:
            CGO_ENABLED: 0
            GOOS: ${{ goos }}
            GOARCH: ${{ goarch }}
            GIT_TAG: $(git describe --tags 2>/dev/null || echo "dev")
            GIT_COMMIT: $(git rev-parse HEAD)
            GIT_TIME: $(git log -1 --format=%ci)
            GIT_BRANCH: $(git rev-parse --abbrev-ref HEAD)
            GIT_MODIFIED: $(git status --porcelain | wc -l)
        run: go build -ldflags="-X 'main.Version=${GIT_TAG}' -X 'main.Commit=${GIT_COMMIT}' -X 'main.CommitTime=${GIT_TIME}' -X 'main.Branch=${GIT_BRANCH}' -X 'main.Modified=${GIT_MODIFIED}'" -o bin/${{name}}-${GOOS}-${GOARCH} ${{build.path}}

  install:
    desc: "Install"
    depends_on: build
    steps:
      - cp -f ./bin/${{name}}-linux-$(dpkg --print-architecture) /usr/local/bin/${{name}}.new
      - mv -f /usr/local/bin/${{name}} /usr/local/bin/${{name}}.old
      - mv -f /usr/local/bin/${{name}}.new /usr/local/bin/${{name}}

  image:
    desc: "Build the docker image"
    depends_on: build
    passthru: true
    steps:
      - docker build -f docker/Dockerfile -t titpetric/vuego-cli:latest .

  up:
    desc: "Serve the repository content trees behind caddy"
    depends_on: image
    passthru: true
    steps:
      - docker compose up -d
      - docker compose ps

  down:
    desc: "Stop the content trees"
    passthru: true
    steps:
      - docker compose down

  clean:
    steps:
      - rm bin/vuego* -f
